name: Update and deploy

# Twice a day: pull new episodes into the database, rebuild charts, build the site
# and deploy it to Cloudflare Pages. While the archive backfill is still running,
# it deploys from the backfill's latest database without writing to it.
on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write # upload the database release asset
  actions: read   # check whether a backfill is running

concurrency:
  group: update
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  DB_RELEASE: db-latest
  PAGES_PROJECT: nts-charts

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download database
        run: |
          gh release download "$DB_RELEASE" --pattern nts.sqlite.gz --dir data
          gunzip data/nts.sqlite.gz
          ls -lh data/nts.sqlite

      - name: Is the backfill running?
        id: backfill
        run: |
          active=$(gh run list --workflow backfill.yml --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          echo "active=$active" >> "$GITHUB_OUTPUT"
          [ "$active" = "0" ] || echo "::notice::Backfill in progress: deploying its latest database without updating it."

      - name: Fetch new episodes
        if: steps.backfill.outputs.active == '0'
        run: node ingest/incremental.ts

      - name: Build charts
        run: node ingest/aggregate.ts

      - name: Upload database
        if: steps.backfill.outputs.active == '0'
        run: |
          gzip -kf data/nts.sqlite
          gh release upload "$DB_RELEASE" data/nts.sqlite.gz --clobber

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project list | grep -q " $PAGES_PROJECT " \
            || npx wrangler pages project create "$PAGES_PROJECT" --production-branch main
          npx wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
