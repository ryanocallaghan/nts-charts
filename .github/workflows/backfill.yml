name: Backfill archive

# Crawls the full NTS archive in hourly chunks (GitHub jobs are capped at 6h).
# Each chunk resumes from the database stored on the "db-latest" release,
# uploads its progress, dispatches the next chunk until nothing remains, and
# redeploys the site so it fills in as the archive arrives.
on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Crawl time budget for this chunk"
        default: "60"

permissions:
  contents: write # upload the database release asset
  actions: write  # dispatch the next chunk

concurrency:
  group: database # never run two jobs that write the database at once
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  DB_RELEASE: db-latest

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download database
        run: |
          if gh release view "$DB_RELEASE" >/dev/null 2>&1; then
            gh release download "$DB_RELEASE" --pattern nts.sqlite.gz --dir data || true
          else
            gh release create "$DB_RELEASE" --title "Database" --latest=false \
              --notes "SQLite database of NTS tracklists, updated automatically."
          fi
          if [ -f data/nts.sqlite.gz ]; then gunzip data/nts.sqlite.gz; fi
          ls -lh data || true

      - name: Crawl
        id: crawl
        run: node ingest/backfill.ts --max-minutes "${{ inputs.max_minutes }}"

      - name: Upload database
        if: ${{ !cancelled() && hashFiles('data/nts.sqlite') != '' }}
        run: |
          gzip -kf data/nts.sqlite
          ls -lh data/nts.sqlite.gz
          gh release upload "$DB_RELEASE" data/nts.sqlite.gz --clobber

      - name: Queue next chunk
        if: ${{ success() && steps.crawl.outputs.remaining != '0' }}
        run: gh workflow run backfill.yml --ref "${{ github.ref_name }}" -f max_minutes="${{ inputs.max_minutes }}"

      - name: Redeploy site with this snapshot
        if: ${{ success() }}
        run: gh workflow run update.yml --ref "${{ github.ref_name }}"
