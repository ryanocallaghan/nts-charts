name: Artist info

# Matches artists with pre-built pages to MusicBrainz and stores facts, Bandcamp/Instagram/Discogs links
# and a short intro (Wikipedia, or the MusicBrainz annotation). Daily top-ups take minutes; the first
# full pass (~12,000 artists at MusicBrainz's 1 request/second) runs in chained chunks.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Time budget for this chunk"
        default: "300"

permissions:
  contents: write # upload the database release asset
  actions: write  # dispatch the next chunk and the redeploy

concurrency:
  group: database # never run alongside the backfill or another writer
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  DB_RELEASE: db-latest

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The backfill chains its chunks through the same lock; don't wedge this job between them.
      - name: Wait for the backfill to finish
        id: gate
        run: |
          active=$(gh run list --workflow backfill.yml --json status --jq '[.[] | select(.status != "completed")] | length')
          echo "skip=$([ "$active" = "0" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          [ "$active" = "0" ] || echo "::notice::Backfill still running; artist info will run on the next schedule."

      - name: Download database
        if: steps.gate.outputs.skip == 'false'
        run: bash scripts/download-db.sh

      - name: Look up artists
        id: enrich
        if: steps.gate.outputs.skip == 'false'
        run: node ingest/enrich.ts --max-minutes "${{ inputs.max_minutes || '300' }}"

      - name: Upload database
        if: ${{ !cancelled() && steps.gate.outputs.skip == 'false' && hashFiles('data/nts.sqlite') != '' }}
        run: |
          gzip -kf data/nts.sqlite
          ls -lh data/nts.sqlite.gz
          gh release upload "$DB_RELEASE" data/nts.sqlite.gz --clobber

      - name: Queue next chunk
        if: ${{ success() && steps.gate.outputs.skip == 'false' && steps.enrich.outputs.remaining != '0' }}
        run: gh workflow run enrich.yml --ref "${{ github.ref_name }}"

      - name: Redeploy site
        if: ${{ success() && steps.gate.outputs.skip == 'false' }}
        run: gh workflow run update.yml --ref "${{ github.ref_name }}"
