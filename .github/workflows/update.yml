name: Update and deploy

# Twice a day: pull new episodes into the database, rebuild charts, build the site
# and deploy it to Cloudflare Pages. While the archive backfill is still running,
# it deploys from the backfill's latest database without writing to it.
on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write # upload the database release asset
  actions: read   # check whether a backfill is running

concurrency:
  group: update
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  DB_RELEASE: db-latest
  PAGES_PROJECT: nts-charts

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download database
        run: bash scripts/download-db.sh

      # Only the main branch writes the database; other branches build a preview from it.
      # Backfill and artist-info jobs write the database too; while either runs, deploy without writing.
      - name: Is the backfill running?
        id: backfill
        run: |
          active=0
          for wf in backfill.yml enrich.yml; do
            n=$(gh run list --workflow "$wf" --json status --jq '[.[] | select(.status != "completed")] | length')
            active=$((active + n))
          done
          [ "${{ github.ref_name }}" = "main" ] || { active=preview; echo "::notice::Preview of ${{ github.ref_name }}: not updating the database."; }
          echo "active=$active" >> "$GITHUB_OUTPUT"
          [ "$active" = "0" ] || [ "$active" = "preview" ] || echo "::notice::Backfill or artist-info job in progress: deploying the latest database without updating it."

      - name: Fetch new episodes
        if: steps.backfill.outputs.active == '0'
        run: node ingest/incremental.ts

      - name: Build charts
        run: node ingest/aggregate.ts

      - name: Upload database
        if: steps.backfill.outputs.active == '0'
        run: |
          gzip -kf data/nts.sqlite
          gh release upload "$DB_RELEASE" data/nts.sqlite.gz --clobber

      - name: Build site
        run: npm run build

      - name: Check the deploy fits Cloudflare's file limit
        run: |
          files=$(find dist -type f | wc -l)
          echo "$files files"
          # Cloudflare Pages rejects deploys over 20,000 files; fail here so the live site stays up.
          if [ "$files" -gt 19800 ]; then
            echo "::error::$files files is over the Cloudflare Pages limit. Lower ARTIST_PAGE_LIMIT."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project list | grep -q " $PAGES_PROJECT " \
            || npx wrangler pages project create "$PAGES_PROJECT" --production-branch main
          # Branches other than main become preview deployments at <branch>.nts-charts.pages.dev.
          npx wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch "${{ github.ref_name }}" --commit-dirty=true
